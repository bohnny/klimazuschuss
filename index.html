    <!-- Google Consent Mode v2: Default DENIED until user accepts -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'denied',

        'ad_personalization': 'denied',
        'analytics_storage': 'denied'
      });
    </script>

    <!-- Cookie Consent Logic -->
    <script>
      function kzLoadTracking() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18061857220';
        s.async = true;
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('consent', 'update', {
          'ad_storage': 'granted',
          'ad_user_data': 'granted',
          'ad_personalization': 'granted',
          'analytics_storage': 'granted'
        });
        gtag('config', 'AW-18061857220');
        gtag('config', 'G-P5XL61RKRD');
      }

      function kzAcceptCookies() {
        localStorage.setItem('kz_consent', 'granted');
        localStorage.setItem('kz_consent_date', new Date().toISOString());
        kzLoadTracking();
        document.getElementById('kz-cookie-banner').style.display = 'none';
      }

      function kzDeclineCookies() {
        localStorage.setItem('kz_consent', 'denied');
        localStorage.setItem('kz_consent_date', new Date().toISOString());
        document.getElementById('kz-cookie-banner').style.display = 'none';
      }

      function kzResetCookies() {
        localStorage.removeItem('kz_consent');
        localStorage.removeItem('kz_consent_date');
        document.getElementById('kz-cookie-banner').style.display = 'flex';
      }

      // Check previous consent on page load
      document.addEventListener('DOMContentLoaded', function() {
        var consent = localStorage.getItem('kz_consent');
        if (consent === 'granted') {
          kzLoadTracking();
        } else if (consent !== 'denied') {
          // No choice yet: show banner
          document.getElementById('kz-cookie-banner').style.display = 'flex';
        }
      });
    </script>

    <style>
      #kz-cookie-banner {
        display: none;

      #kz-cookie-banner .kz-cb-accept {

      #kz-cookie-banner .kz-cb-decline {

    </style>

        <button class="kz-cb-btn kz-cb-decline" onclick="kzDeclineCookies()">Ablehnen</button>
